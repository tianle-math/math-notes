name: Publish mathematical notebook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.10.19
      - name: Set public website URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/set-site-url.py
      - name: Check source for accidental private content
        run: python3 scripts/check-site.py source
      - name: Restore incremental translations
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _i18n/generated
          key: translations-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: translations-v1-
      - name: Check translation safeguards
        run: python3 -m unittest discover -s scripts -p 'test_i18n.py'
      - name: Render all three languages
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
          TRANSLATION_MAX_CHARS: ${{ vars.TRANSLATION_MAX_CHARS || '20000' }}
        run: python3 scripts/build-multilingual.py
      - name: Check generated website
        run: python3 scripts/check-site.py output
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

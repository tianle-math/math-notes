project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - harmonic-analysis.qmd
    - martingales.qmd
    - operator-algebras.qmd
    - functional-analysis.qmd
    - personal.qmd
    - series.qmd
    - 404.qmd
    - essays/*.qmd
  resources:
    - assets/*.svg
    - assets/*.webp
    - assets/community.css
    - assets/community.js

website:
  title: "Tian · Mathematics & Essays"
  description: "An open notebook by Tian: harmonic analysis, martingale theory, operator algebras, functional analysis, reflections, and essays."
  favicon: assets/favicon.svg
  search: false
  navbar:
    background: light
    pinned: false
    title: "Tian · Mathematics & Essays"
    left:
      - href: index.qmd
        text: Home
      - text: Mathematical Notes
        menu:
          - href: harmonic-analysis.qmd
            text: Harmonic Analysis
          - href: martingales.qmd
            text: Martingale Theory
          - href: operator-algebras.qmd
            text: Operator Algebras
          - href: functional-analysis.qmd
            text: Functional Analysis
      - href: personal.qmd
        text: Reflections & Essays
  page-footer:
    center: |
      <div class="copyright-notice">
      <p class="copyright-line">© 2026 <strong>Tian</strong>. All rights reserved.</p>
      <p>Unless otherwise indicated, copyright-protected articles and illustrations may not be reproduced or redistributed without prior permission, except as permitted by applicable law. For quotations and citations, please credit Tian and link to the original page.</p>
      </div>
  open-graph: true
  twitter-card: false
  draft-mode: gone

format:
  html:
    theme:
      - default
      - assets/styles.scss
    lang: en
    toc: true
    toc-title: "On this page"
    toc-depth: 2
    number-sections: false
    anchor-sections: true
    smooth-scroll: false
    html-math-method: mathml
    code-copy: true
    code-tools: false
    link-external-newwindow: false
    date-format: "MMMM D, YYYY"
    include-in-header: assets/head.html
    grid:
      sidebar-width: 200px
      body-width: 790px
      margin-width: 240px
      gutter-width: 2rem

execute:
  enabled: false

editor: source

project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - harmonic-analysis.qmd
    - martingales.qmd
    - operator-algebras.qmd
    - functional-analysis.qmd
    - personal.qmd
    - series.qmd
    - 404.qmd
    - essays/*.qmd
  resources:
    - assets/*.svg

website:
  title: "Tian · 数学与随笔"
  description: "Tian 的公开笔记：调和分析、鞅论、算子代数、泛函分析，以及杂谈与随笔。"
  favicon: assets/favicon.svg
  search: false
  navbar:
    background: light
    pinned: false
    title: "Tian · 数学与随笔"
    left:
      - href: index.qmd
        text: 首页
      - text: 数学笔记
        menu:
          - href: harmonic-analysis.qmd
            text: 调和分析
          - href: martingales.qmd
            text: 鞅论
          - href: operator-algebras.qmd
            text: 算子代数
          - href: functional-analysis.qmd
            text: 泛函分析
      - href: personal.qmd
        text: 杂谈与随笔
  page-footer:
    left: "数学笔记 · 杂谈与随笔"
    right: "Written by Tian"
  open-graph: true
  twitter-card: false
  draft-mode: gone

format:
  html:
    theme:
      - default
      - assets/styles.scss
    lang: zh-CN
    toc: true
    toc-title: "本页目录"
    toc-depth: 2
    number-sections: false
    anchor-sections: true
    smooth-scroll: false
    html-math-method: mathml
    code-copy: true
    code-tools: false
    link-external-newwindow: false
    date-format: "MMMM D, YYYY"
    include-in-header: assets/head.html
    grid:
      sidebar-width: 200px
      body-width: 790px
      margin-width: 240px
      gutter-width: 2rem

execute:
  enabled: false

editor: source
